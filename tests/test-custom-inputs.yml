name: Test custom inputs - tool name and level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid workflow file
        run: |
          mkdir -p /tmp/custom-test/.github/workflows
          cat > /tmp/custom-test/.github/workflows/simple.yml << 'EOF'
          name: Simple Workflow
          on:
            workflow_dispatch:
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Hello
                  run: echo "hello"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "my-actionlint"
          level: "warning"
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "/tmp/custom-test/.github/workflows/simple.yml"

      - name: Assert action completed with custom inputs
        run: |
          echo "Action completed with custom tool_name and level"
          echo "PASS"
