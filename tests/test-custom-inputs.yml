name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: actionlint-custom
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "my-actionlint"
          level: "warning"
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore 'SC2'"

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.actionlint-custom.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran successfully with custom tool_name and level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint ran (may have found issues or reporter limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
