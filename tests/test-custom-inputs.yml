name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a valid workflow file for actionlint to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cp "$GITHUB_WORKSPACE/tests/fixtures/valid-workflow.yml" \
             "$GITHUB_WORKSPACE/.github/workflows/test-valid-workflow.yml"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-actionlint
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: ".github/workflows/test-valid-workflow.yml"

      - name: Assert action succeeded with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with custom tool_name and level"
            exit 1
          fi
          echo "PASS: actionlint ran successfully with custom tool_name=my-actionlint and level=warning"
