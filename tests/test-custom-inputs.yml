name: Test custom inputs (tool_name, level, filter_mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a valid workflow file for actionlint to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.github/workflows/sample.yml" << 'EOF'
          name: Sample workflow
          on:
            pull_request:
          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - name: Run linter
                  run: echo "linting"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-actionlint
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          fail_on_error: "false"

      - name: Assert action completed with custom tool name and warning level
        run: |
          echo "Action completed with custom tool_name and warning level"
          echo "PASS"
