name: Test custom options - tool_name and level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Copy valid workflow fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cp "$GITHUB_WORKSPACE/tests/fixtures/valid-workflow.yml" \
             "$GITHUB_WORKSPACE/.github/workflows/valid-workflow.yml"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: "my-actionlint"
          level: "warning"
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "${{ github.workspace }}/.github/workflows/valid-workflow.yml"

      - name: Assert action completed with custom options
        run: |
          echo "PASS: actionlint ran successfully with custom tool_name and level"
