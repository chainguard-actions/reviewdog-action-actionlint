name: Test actionlint_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a workflow file that would normally trigger actionlint warnings
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/flags-test-workflow.yml << 'EOF'
          name: Flags Test Workflow
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Run script
                  run: echo "testing actionlint flags"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          # Pass -version flag to verify actionlint_flags are forwarded
          # Note: -version causes actionlint to print version and exit 0
          actionlint_flags: "-ignore 'SC2.*'"
        continue-on-error: true

      - name: Assert action ran with actionlint_flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with actionlint_flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable under sentinel repo constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
