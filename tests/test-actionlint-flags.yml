name: Test actionlint_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: actionlint
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: warning
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore 'SC2.*'"

      - name: Assert step succeeded with custom actionlint_flags
        env:
          OUTCOME: ${{ steps.actionlint.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran successfully with custom actionlint_flags"
