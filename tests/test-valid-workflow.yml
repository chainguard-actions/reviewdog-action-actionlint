name: Test valid workflow passes lint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
          tool_name: actionlint-test
          actionlint_flags: tests/fixtures/valid-workflow.yml
      - name: Assert action succeeded on a valid workflow
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for a lint-clean workflow"
            exit 1
          fi
          echo "PASS"
