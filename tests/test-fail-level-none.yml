name: Test fail_level none always exits zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a workflow file with actionlint issues
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/has-issues-workflow.yml << 'EOF'
          name: Workflow With Issues
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Step referencing undefined step output
                  run: echo "${{ steps.undefined_step.outputs.result }}"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
        # With fail_level=none, reviewdog always exits 0 regardless of findings.
        # However, the action may still fail due to the sentinel repo context.
        continue-on-error: true

      - name: Assert action ran with fail_level none
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=none and local reporter, the action should succeed
          # (reviewdog exits 0). A failure here would indicate a docker/env issue.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 as expected with fail_level=none"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable under sentinel repo constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
