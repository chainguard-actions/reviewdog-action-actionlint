name: Test fail_level - action exits non-zero when errors found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a workflow file with a known actionlint error
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.github/workflows/bad-workflow.yml" << 'EOF'
          name: Bad Workflow
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Bad step
                  run: echo ${{ github.event.nonexistent_field }}
                  if: github.event_name == 'push'
          EOF

      - id: actionlint-fail
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          actionlint_flags: "-ignore 'SC2'"

      - name: Assert action failed due to errors found
        env:
          OUTCOME: ${{ steps.actionlint-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint correctly exited non-zero when errors found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran (no errors detected or reporter limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
