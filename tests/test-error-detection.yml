name: Test error detection - invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid workflow file for actionlint to detect errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          sed 's/^          //' > "$GITHUB_WORKSPACE/.github/workflows/invalid-test.yml" <<'WFEOF'
          name: Invalid workflow
          on: push
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Bad step
                  run: echo "hello"
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
          WFEOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: error
          filter_mode: nofilter
          fail_level: error
        continue-on-error: true

      - name: Assert action detected errors and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid workflow is present, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected errors in invalid workflow"
