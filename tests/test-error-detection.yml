name: Test error detection - invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid workflow file for actionlint to detect errors
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/invalid-test.yml << 'EOF'
          name: Invalid workflow
          on: push
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Bad expression
                  run: echo ${{ toJson(github.event.nonexistent_field) }}
                - name: Unknown action
                  uses: actions/nonexistent-action@v999
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
          level: error
          actionlint_flags: "-ignore 'SC2086'"
        continue-on-error: true

      - name: Assert actionlint detected errors or ran gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and an invalid workflow, we expect failure
          # OR the action may fail due to sentinel repo API limitations
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint reported errors (expected for invalid workflow or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran (no errors detected or API call succeeded)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
