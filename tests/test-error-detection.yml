name: Test error detection with invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid workflow file for actionlint to detect errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          # Create a workflow with an invalid runner label (actionlint will flag this)
          cat > "$GITHUB_WORKSPACE/.github/workflows/invalid-test.yml" << 'EOF'
          name: Invalid workflow
          on: push
          jobs:
            build:
              runs-on: invalid-runner-that-does-not-exist-xyz
              steps:
                - name: Echo
                  run: echo "hello"
                  unknown-key: this-is-invalid
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action detected errors and exited with failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint correctly detected errors in the invalid workflow"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran successfully (may not have flagged the specific issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
