name: Test error detection - invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid workflow file with actionlint errors
        run: |
          mkdir -p /tmp/bad-workflows/.github/workflows
          cat > /tmp/bad-workflows/.github/workflows/invalid.yml << 'EOF'
          name: Invalid Workflow
          on: push
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Bad expression
                  run: echo ${{ toJSON(github.event.nonexistent_field) }}
                  env:
                    UNDEFINED_VAR: ${{ steps.nonexistent.outputs.result }}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          actionlint_flags: "/tmp/bad-workflows/.github/workflows/invalid.yml"

      - name: Assert action detected errors and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint correctly detected errors and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran successfully (may not have detected errors in this context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
