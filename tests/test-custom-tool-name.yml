name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid workflow file
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/custom-tool-test.yml << 'EOF'
          name: Custom Tool Test Workflow
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Echo
                  run: echo "hello world"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-custom-actionlint
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with custom tool_name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with custom tool_name and warning level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable under sentinel repo constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
