name: Test invalid actionlint flag fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: -this-flag-does-not-exist
      - name: Assert action failed due to invalid actionlint flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (actionlint exit 2 must not be swallowed)"
            exit 1
          fi
          echo "PASS"
