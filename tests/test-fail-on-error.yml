name: Test fail_level with actionlint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a workflow file with actionlint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          # This workflow references an undefined expression which actionlint will flag
          cat > "$GITHUB_WORKSPACE/.github/workflows/bad-workflow.yml" << 'EOF'
          name: Bad Workflow
          on: push
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Use undefined context
                  run: echo "${{ steps.nonexistent.outputs.result }}"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: any

      - name: Assert action failed due to actionlint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when actionlint found errors with fail_level=any"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (actionlint may not have flagged this pattern)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
