name: Test fail_level=error with invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a deliberately invalid workflow file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.github/workflows/bad-workflow.yml" << 'EOF'
          name: Bad Workflow
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Bad step
                  run: echo hello
                  uses: actions/checkout@v4
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
        continue-on-error: true

      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and an invalid workflow, the action should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when lint errors were found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (actionlint may have not flagged the file or reported differently)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Clean up bad workflow file
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/.github/workflows/bad-workflow.yml"
