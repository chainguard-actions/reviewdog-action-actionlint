name: Test basic usage - valid workflows
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a valid workflow file for actionlint to check
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          sed 's/^          //' > "$GITHUB_WORKSPACE/.github/workflows/valid-test.yml" <<'WFEOF'
          name: Valid workflow
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
                - name: Run a script
                  run: echo "hello"
          WFEOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: error
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
