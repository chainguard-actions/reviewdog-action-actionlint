name: Test basic usage - valid workflows
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid workflow file for actionlint to check
        run: |
          mkdir -p /tmp/test-workflows/.github/workflows
          cat > /tmp/test-workflows/.github/workflows/valid.yml << 'EOF'
          name: Valid Workflow
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Run a script
                  run: echo "Hello, World!"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore SC2148 /tmp/test-workflows/.github/workflows/valid.yml"

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no fatal errors"
          echo "PASS"
