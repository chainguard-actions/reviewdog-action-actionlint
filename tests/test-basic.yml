name: Test basic usage - valid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a valid workflow for actionlint to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cp "$GITHUB_WORKSPACE/tests/fixtures/workflows/valid.yml" \
             "$GITHUB_WORKSPACE/.github/workflows/valid.yml"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
        continue-on-error: true

      - name: Assert action succeeded on valid workflow
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran successfully on valid workflow"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no issues found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
