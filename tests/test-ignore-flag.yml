name: Test actionlint ignore flag with quoted spaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: error
          actionlint_flags: -ignore 'undefined variable' tests/fixtures/broken-workflow.yml
      - name: Assert ignored error does not fail the step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when the error is ignored"
            exit 1
          fi
          echo "PASS"
