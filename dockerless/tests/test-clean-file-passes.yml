name: Test clean workflow passes with fail_level any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide Python 3.12 (pinned pyflakes requires Python >= 3.11)
        run: |
          python3 -m pip install --quiet uv
          python3 -m uv python install 3.12
          python3 -m uv venv --seed --python 3.12 "$RUNNER_TEMP/py312"
          "$RUNNER_TEMP/py312/bin/python" --version
          echo "$RUNNER_TEMP/py312/bin" >> "$GITHUB_PATH"
      - name: Verify new Python is first on PATH
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
          level: warning
          tool_name: actionlint-test
          actionlint_flags: tests/fixtures/good-workflow.yml
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for clean workflow"
            exit 1
          fi
          echo "PASS"
