name: Test fail_level detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid workflow file for actionlint to detect errors
        run: |
          mkdir -p .github/workflows
          # This workflow has an invalid runner name which actionlint should flag
          cat > .github/workflows/invalid-test.yml << 'EOF'
          name: Invalid Workflow
          on:
            push:
          jobs:
            build:
              runs-on: invalid-runner-that-does-not-exist
              steps:
                - name: Use undefined expression
                  run: echo "${{ env.UNDEFINED_VAR }}"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
        continue-on-error: true

      - name: Assert action ran (may fail due to lint errors or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and an invalid workflow, the action may exit with failure
          # This is expected behavior - we just verify it ran (not skipped)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME (failure is acceptable when lint errors found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
