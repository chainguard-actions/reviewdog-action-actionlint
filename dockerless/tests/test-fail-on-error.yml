name: Test fail_level triggers on invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid workflow file for actionlint to detect errors
        run: |
          mkdir -p .github/workflows
          # Create a workflow with a known actionlint error: invalid event name
          cat > .github/workflows/invalid-test.yml << 'EOF'
          name: Invalid Test Workflow
          on:
            push:
              branches:
                - main
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Bad step
                  run: echo "hello"
                  # Using an undefined expression that actionlint will flag
                  env:
                    FOO: ${{ runner.invalid_property }}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          fail_level: error
          filter_mode: nofilter
          level: error

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (no errors found) or fail (errors found).
          # Either is acceptable — we just verify it ran and produced a result.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
