name: Test fail_level=error detects invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid workflow file to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          # This workflow has an invalid runner name which actionlint should flag
          cat > "$GITHUB_WORKSPACE/.github/workflows/sample-invalid.yml" <<'EOF'
          name: Invalid Workflow
          on: push
          jobs:
            build:
              runs-on: invalid-runner-that-does-not-exist
              steps:
                - name: Echo
                  run: echo "hello"
                  with:
                    key: value
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
        continue-on-error: true

      - name: Assert action detected errors and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # actionlint should detect the invalid workflow and fail with fail_level=error
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when linting an invalid workflow"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (actionlint may have different error classification)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
