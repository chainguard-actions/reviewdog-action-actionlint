name: Test fail_level=none - action exits 0 even with lint issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a workflow file with a known actionlint issue
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.github/workflows/bad-workflow.yml" << 'EOF'
          name: Bad workflow
          on: push
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Use undefined expression
                  run: echo "${{ toJson(github.event.nonexistent_field) }}"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          fail_on_error: "false"
        continue-on-error: true

      - name: Assert action did not fail (fail_level=none means always exit 0)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=none, reviewdog always exits 0 regardless of findings.
          # The action may still fail due to installation issues in the act environment,
          # but it should NOT fail due to lint findings.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail_level=none"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act/sentinel environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
