name: Test reviewdog_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a valid workflow file for actionlint to check
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/workflows"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/workflows/valid.yml" <<'EOF'
          name: Valid Workflow
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - name: Echo
                  run: echo "hello"
          EOF
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          reviewdog_flags: "-tee"
          actionlint_flags: "$GITHUB_WORKSPACE/tests/fixtures/workflows/valid.yml"
      - name: Assert action completed with reviewdog_flags
        run: |
          echo "PASS: actionlint ran successfully with additional reviewdog_flags"
