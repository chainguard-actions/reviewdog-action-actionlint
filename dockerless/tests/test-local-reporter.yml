name: Test local reporter mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid workflow file for actionlint to check
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/sample.yml << 'EOF'
          name: Sample
          on:
            push:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Hello
                  run: echo "hello world"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed or fail gracefully (e.g. if API calls fail on sentinel repo)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
