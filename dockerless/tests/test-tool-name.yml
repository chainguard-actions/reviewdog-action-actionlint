name: Test custom tool name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid workflow file
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/simple-test.yml << 'EOF'
          name: Simple Test Workflow
          on:
            push:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Hello
                  run: echo "hello"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-actionlint
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with custom tool name and level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran with custom tool_name and level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to environment constraints, but was invoked)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
