name: Test basic usage on a clean workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide Python >= 3.11 on PATH (pyflakes pin requires it)
        run: |
          set -eux
          python3 -m pip install --quiet uv
          python3 -m uv venv --python 3.12 --seed /tmp/py312
          /tmp/py312/bin/python --version
          /tmp/py312/bin/pip --version
          echo "/tmp/py312/bin" >> "$GITHUB_PATH"
      - name: Check python on PATH
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: error
          actionlint_flags: tests/fixtures/clean-workflow.yml
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
