name: Test custom tool_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install tools to speed up action
        run: |
          sudo apt-get install -y shellcheck 2>/dev/null || true
          pip install pyflakes 2>/dev/null || true

      - id: action
        name: Run actionlint with custom tool_name
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: my-actionlint
          reporter: local
          level: warning
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore 'SC2' -ignore 'shellcheck'"

      - name: Assert action ran with custom tool name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran successfully with custom tool_name 'my-actionlint'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (tool installation or lint issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
