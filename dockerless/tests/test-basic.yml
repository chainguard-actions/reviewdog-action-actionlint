name: Test basic usage - valid workflow files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install tools to speed up action
        run: |
          # Install shellcheck
          sudo apt-get install -y shellcheck 2>/dev/null || true
          # Install pyflakes
          pip install pyflakes 2>/dev/null || true

      - id: action
        name: Run actionlint with reviewdog (local reporter)
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: error
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore 'SC2' -ignore 'shellcheck'"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran successfully with local reporter"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (tool installation or lint issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
