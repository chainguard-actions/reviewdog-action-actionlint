name: Test basic usage - valid workflows
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid workflow file for actionlint to scan
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/valid-test.yml << 'EOF'
          name: Valid Test Workflow
          on:
            push:
              branches:
                - main
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Run tests
                  run: echo "hello"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          fail_level: none
          filter_mode: nofilter

      - name: Assert action completed successfully
        run: |
          echo "PASS: actionlint ran successfully with local reporter"
