name: Test actionlint_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a workflow file for actionlint to lint
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/test-target.yml << 'EOF'
          name: Test Target
          on:
            push:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Run something
                  run: echo "testing actionlint flags"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore SC2086"
        continue-on-error: true

      - name: Assert action ran with actionlint_flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with actionlint_flags (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
