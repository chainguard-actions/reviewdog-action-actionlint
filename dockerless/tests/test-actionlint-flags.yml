name: Test custom actionlint flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow files for actionlint to scan
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/sample.yml << 'EOF'
          name: Sample Workflow
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Build
                  run: echo "building"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          fail_level: none
          filter_mode: nofilter
          # Pass -oneline flag to actionlint for compact output
          actionlint_flags: "-oneline"

      - name: Assert action completed with custom flags
        run: |
          echo "PASS: actionlint ran successfully with custom actionlint_flags"
