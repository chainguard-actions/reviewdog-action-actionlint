name: Test actionlint_flags input - suppress specific checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow files for actionlint to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          # Create a workflow that would normally trigger shellcheck warnings
          cat > "$GITHUB_WORKSPACE/.github/workflows/shellcheck-test.yml" << 'EOF'
          name: Shellcheck test workflow
          on:
            push:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Run script
                  shell: bash
                  run: |
                    echo "testing actionlint flags"
                    echo "with shellcheck integration"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore SC2148 -ignore SC2086"
        continue-on-error: true

      - name: Assert action ran with actionlint_flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with actionlint_flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act/sentinel environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
