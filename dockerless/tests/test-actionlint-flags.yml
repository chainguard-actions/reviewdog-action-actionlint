name: Test actionlint_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          actionlint_flags: "-ignore SC2"
      - name: Assert action completed with actionlint_flags
        run: |
          echo "PASS: actionlint ran with custom actionlint_flags"
