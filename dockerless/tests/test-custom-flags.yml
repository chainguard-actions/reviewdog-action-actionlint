name: Test custom actionlint flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a workflow file with a known issue
        run: |
          mkdir -p .github/workflows
          # This workflow uses a runner that actionlint would normally flag
          cat > .github/workflows/flagged-test.yml << 'EOF'
          name: Flagged Test Workflow
          on:
            push:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Test step
                  run: echo "test"
                  with:
                    foo: bar
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          # Use -ignore flag to suppress specific actionlint warnings
          actionlint_flags: "-ignore 'property .+ is not defined'"
        continue-on-error: true

      - name: Assert action ran with custom flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran with custom flags successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to environment constraints, but was invoked with custom flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
