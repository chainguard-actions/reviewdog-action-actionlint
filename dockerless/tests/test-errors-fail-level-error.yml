name: Test errors with fail_level error fail the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          actionlint_flags: ${{ github.workspace }}/tests/fixtures/bad-workflow.yml
      - name: Assert action failed because lint errors were found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with fail_level=error on a bad workflow"
            exit 1
          fi
          echo "PASS"
