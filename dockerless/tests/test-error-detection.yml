name: Test error detection - invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid workflow file with actionlint errors
        run: |
          mkdir -p .github/workflows
          # This workflow has an invalid runner name which actionlint will flag
          cat > .github/workflows/invalid-test.yml << 'EOF'
          name: Invalid Test Workflow
          on:
            push:
          jobs:
            build:
              runs-on: invalid-runner-that-does-not-exist
              steps:
                - name: Bad step
                  run: echo "test"
                  with:
                    foo: bar
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
        continue-on-error: true

      - name: Assert actionlint detected errors and action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because actionlint found errors in the invalid workflow
          # (fail_level=error means reviewdog exits 1 when errors are found)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint correctly detected errors in invalid workflow"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (reviewdog may have filtered results in this context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
