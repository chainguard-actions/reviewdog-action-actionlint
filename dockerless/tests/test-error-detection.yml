name: Test error detection - invalid workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid workflow file for actionlint to detect errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.github/workflows/invalid-test.yml" << 'EOF'
          name: Invalid Workflow
          on: push
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Bad expression
                  run: echo ${{ toJson(github.event.NONEXISTENT_PROPERTY_THAT_DOES_NOT_EXIST) }}
                  env:
                    UNDEFINED_VAR: ${{ steps.nonexistent.outputs.value }}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action detected errors and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: actionlint correctly detected errors in the invalid workflow"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: actionlint ran (may not have flagged the test file depending on path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
