name: Test filter_mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create workflow files for actionlint to scan
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/filter-test.yml << 'EOF'
          name: Filter Test Workflow
          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main
          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Lint
                  run: echo "linting"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          fail_level: none
          # Use 'nofilter' to report all findings regardless of diff
          filter_mode: nofilter

      - name: Assert action completed with nofilter mode
        run: |
          echo "PASS: actionlint ran successfully with filter_mode=nofilter"
