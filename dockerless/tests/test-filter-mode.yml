name: Test filter_mode=nofilter scans all workflow files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple workflow files to lint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.github/workflows/workflow-a.yml" <<'EOF'
          name: Workflow A
          on:
            push:
              branches:
                - main
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - name: Step A
                  run: echo "workflow a"
          EOF

          cat > "$GITHUB_WORKSPACE/.github/workflows/workflow-b.yml" <<'EOF'
          name: Workflow B
          on:
            pull_request:
              branches:
                - main
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                - name: Step B
                  run: echo "workflow b"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action completed scanning all files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with filter_mode=nofilter (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
