name: Test fail_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a workflow file with actionlint errors
        run: |
          mkdir -p /tmp/test-workflows/.github/workflows
          cat > /tmp/test-workflows/.github/workflows/bad.yml << 'EOF'
          name: Bad Workflow
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo ${{ toJSON(github) }}
          EOF

      # Run with fail_level=none to ensure the action always exits 0
      # even if actionlint finds issues (which it may on the sentinel repo)
      - id: action-no-fail
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action ran with fail_level=none
        env:
          OUTCOME: ${{ steps.action-no-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with fail_level=none"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
