name: Test fail_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
      - name: Assert action completed with fail_level=error
        run: |
          echo "PASS: actionlint ran with fail_level=error and no errors were found"
