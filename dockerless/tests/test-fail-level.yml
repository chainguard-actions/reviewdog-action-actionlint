name: Test fail_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: error
          # Suppress shellcheck/pyflakes sub-linter noise
          actionlint_flags: "-ignore SC.* -ignore E.*"

      - name: Assert action ran with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error, the action exits 1 only if actionlint finds errors.
          # Under the harness the repo may or may not have actionlint errors, so
          # both success and failure are acceptable outcomes — what matters is that
          # the action ran (not a crash/unexpected exit).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with fail_level=error (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
