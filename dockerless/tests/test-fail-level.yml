name: Test fail_level - actionlint detects errors in bad workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a deliberately invalid workflow file
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/bad-workflow.yml << 'EOF'
          name: Bad Workflow
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Bad step
                  run: echo hello
                  # Invalid: 'uses' and 'run' cannot be used together
                  uses: actions/checkout@v4
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          actionlint_flags: "-ignore 'SC[0-9]+'"

      - name: Assert action detected errors or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and a bad workflow, action should fail (exit 1 from reviewdog)
          # OR fail due to sentinel repo API issues — both are acceptable
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (errors detected or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have filtered the bad file)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
